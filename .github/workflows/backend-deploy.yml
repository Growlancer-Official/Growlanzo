name: Backend Deploy (Supabase)

# Standing rule (founder): backend changes deploy to production in real time,
# same cadence as the frontend (Vercel). Any push touching supabase/** runs:
#   1. Migration drift check — repo migrations must match the live DB exactly
#      (fail-closed: out of sync = no deploy, investigate first)
#   2. supabase db push — applies any pending migrations (no-op when in sync)
#   3. functions deploy — every edge function redeployed from repo source
#      (defaults: verify_jwt honored from config.toml — never loosened here)

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
      - 'supabase/migrations/**'
      - 'supabase/config.toml'
      - '.github/workflows/backend-deploy.yml'
  workflow_dispatch:

concurrency:
  group: backend-deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  SUPABASE_PROJECT_REF: zttwsjehcgaicziqyxpq

jobs:
  deploy:
    name: Drift-check → db push → functions deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # PINNED, not `latest`. Two independent reasons, both measured:
      #
      # 1. `version: latest` makes the action call the GitHub releases API to
      #    resolve the newest tag. On a shared runner IP that call is rate
      #    limited and the whole deploy dies in one second with
      #    "Failed to resolve latest Supabase CLI release: rate limit exceeded"
      #    (run 44299835218, 2026-11-18). Nothing downstream ran.
      # 2. Supabase CLI v3 REMOVED `--db-url` from `migration list` and
      #    `db push` (it was replaced by `--remote[=<ref|branch|url>]`). The
      #    drift-check helper and the push below are written against `--db-url`,
      #    and v3 also started requiring `--yes` for hosted changes. Resolving
      #    "latest" would therefore have broken the deploy even without the rate
      #    limit.
      #
      # v2.63.0 is the newest v2 release that still accepts `--db-url` on both
      # commands (verified against the published linux_amd64 binary), so the
      # reviewed migration logic below stays exactly as it was. Moving to v3 is
      # a deliberate migration: change the helper to `--remote=<url>`, add
      # `--yes`, and prove it against a dry run before pinning forward.
      - uses: supabase/setup-cli@v1
        with:
          version: 2.63.0

      # Measured 2026-11-18 (run 77 + the diagnostic run 78): every step called
      # `npx supabase`, which bypasses the binary setup-cli just pinned. supabase
      # is not a dependency of this repo, so npx downloaded **supabase@3.2.0**
      # from npm on every run — and v3 rejects this repo's own config
      # (`inbucket in supabase/config.toml is no longer supported`) before it can
      # even connect. The drift gate therefore died in ~4s on every push (runs
      # 73-78), so no migration and no edge function has been deployed for days.
      # Use the pinned v2 binary from PATH and fail loudly if that ever changes.
      - name: Guard — the pinned v2 CLI is the one that runs
        run: |
          v=$(supabase --version 2>&1 | head -1)
          echo "supabase CLI: $v"
          case "$v" in
            *2.63*) ;;
            *)
              echo "::error::expected the pinned CLI from supabase/setup-cli (version 2.63.0) on PATH, got '$v'. v3 dropped --db-url and rejects this repo's config.toml (inbucket), so the drift check and db push would fail."
              exit 1
              ;;
          esac

      - name: Guard — access token present (fail with setup instructions)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN repo secret is missing. One-time setup: Supabase Dashboard → Account → Access Tokens → generate, then add it in this repo (Settings → Secrets and variables → Actions)."
            exit 1
          fi

      # Resolve the direct Postgres connection WITHOUT requiring a SUPABASE_DB_URL
      # secret: derive the session-pooler URL from the existing SUPABASE_DB_PASSWORD
      # secret + the fixed regional pooler host. The value is never echoed; it is
      # exported for the migration steps only. Fails closed if neither source exists.
      - name: Resolve DB connection (from SUPABASE_DB_PASSWORD — value never printed)
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          if [ -n "$SUPABASE_DB_URL" ]; then
            echo "SUPABASE_DB_URL_RESOLVED=$SUPABASE_DB_URL" >> "$GITHUB_ENV"
            echo "DB connection source: SUPABASE_DB_URL secret"
          elif [ -n "$SUPABASE_DB_PASSWORD" ]; then
            encoded=$(node -e 'console.log(encodeURIComponent(process.env.SUPABASE_DB_PASSWORD))')
            {
              echo "SUPABASE_DB_URL_RESOLVED=postgresql://postgres.${{ env.SUPABASE_PROJECT_REF }}:${encoded}@aws-1-ap-southeast-1.pooler.supabase.com:5432/postgres"
            } >> "$GITHUB_ENV"
            echo "DB connection source: SUPABASE_DB_PASSWORD secret (URL derived)"
          else
            echo "::error::Neither SUPABASE_DB_URL nor SUPABASE_DB_PASSWORD repo secret is set. migration list / db push connect directly to Postgres (CI runners have no cached DB password). One-time setup: add SUPABASE_DB_PASSWORD (Project Settings → Database → database password) in this repo's Actions secrets. Never print or log its value."
            exit 1
          fi

      # Fail-closed BEFORE anything deploys. The pentest below is the only thing
      # that proves the deploy landed the latest locks and guards, so a deploy
      # whose verification cannot run must not be recorded as a successful one.
      # It used to print `::notice:: ... SKIPPED` and exit 0, which made the
      # deploy green while its security check had never executed.
      - name: Guard — pentest secrets present (fail-closed)
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          missing=""
          if [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then missing="$missing SUPABASE_SERVICE_ROLE_KEY"; fi
          if [ -z "$VITE_SUPABASE_ANON_KEY" ]; then missing="$missing VITE_SUPABASE_ANON_KEY"; fi
          if [ -n "$missing" ]; then
            echo "::error::Privilege + money-path pentest CANNOT RUN — missing repository secret(s):$missing. Failing BEFORE the deploy on purpose: no migration or function deploy is recorded as successful when its security verification was skipped."
            echo "::error::One-time setup — add both under Settings → Secrets and variables → Actions: SUPABASE_SERVICE_ROLE_KEY (Supabase Dashboard → Project Settings → API → service_role key) and VITE_SUPABASE_ANON_KEY (the public anon key, same value the frontend ships)."
            exit 1
          fi
          echo "Pentest secrets present — the deploy will be verified against production when it finishes."

      # NOTE: `migration list --output json` is NOT supported by the CLI — it
      # prints a human table. Compare REMOTE-applied versions (column 2) against
      # repo migration files. --db-url avoids the interactive password prompt.
      #
      # `pre`  (before db push): only remote-only entries are drift. A migration
      #        that exists in the repo but is not applied yet is PENDING — that is
      #        precisely what the next step pushes, so it must not fail the gate.
      #        (Treating it as drift made every new migration undeployable.)
      # `post` (after db push): both directions must be empty, which proves the
      #        push actually landed every pending migration.
      - name: Write migration drift-check helper
        run: |
          cat > /tmp/driftcheck.mjs << 'EOF'
          import fs from 'fs';
          import { execSync } from 'child_process';
          const mode = process.argv[2] || 'pre';
          const dbUrl = process.env.SUPABASE_DB_URL;
          // Redact the DB URL before anything reaches the log: it carries the
          // database password. Measured 2026-11-18: run 77 died here in 4s with
          // NO drift annotation at all, because stderr was discarded — so a CLI
          // connection/auth error was indistinguishable from real drift and went
          // undiagnosed. Keep the diagnostic, strip the credential.
          const redact = (text) => String(text ?? '')
            .split(dbUrl).join('[db-url]')
            .replace(/postgres(?:ql)?:\/\/\S+/g, '[db-url]');
          let out;
          try {
            out = execSync('supabase migration list --db-url ' + JSON.stringify(dbUrl), {encoding:'utf8', stdio:['ignore','pipe','pipe'], shell:true});
          } catch (err) {
            const detail = redact([err.stderr, err.stdout, err.message].filter(Boolean).join('\n')).trim();
            console.error('::error::supabase migration list failed — the drift check could not run, so nothing was deployed. Redacted output follows:');
            for (const line of detail.split(/\r?\n/).slice(-12)) console.error('::error::' + line.trim());
            process.exit(1);
          }
          const remote = new Set();
          for (const line of out.split(/\r?\n/)) {
            if (!line.includes('|')) continue;
            const c = line.split('|').map(s => s.trim().replace(/`/g, ''));
            if (c.length >= 2 && /^\d{6,}$/.test(c[1])) remote.add(c[1]);
          }
          const files = fs.readdirSync('supabase/migrations').filter(f => f.endsWith('.sql') && f !== 'README.md');
          const fileVersions = new Set(files.map(f => f.match(/^(\d{6,})/)?.[1]).filter(Boolean));
          const remoteOnly = [...remote].filter(v => !fileVersions.has(v));
          const localOnly = [...fileVersions].filter(v => !remote.has(v));
          // Two repo files under one version is a silent deploy-killer, measured
          // 2026-10-15: `supabase db push` matches a repo file to a live row BY
          // VERSION, so when 20270119000000 named two different files only the
          // first could ever match. The second looked permanently unapplied, and
          // the attempt to apply it failed with a duplicate-key error on
          // schema_migrations -- reporting the misleading "a migration in the
          // local directory does not exist on the remote database". Nothing else
          // catches it: the file is valid SQL, and the version is not drift in
          // either direction (both files' version IS applied). Fail here, naming
          // both files, so the fix is a renumber rather than a push flag.
          const versionFiles = new Map();
          for (const f of files) {
            const v = f.match(/^(\d{6,})/)?.[1];
            if (!v) continue;
            versionFiles.set(v, [...(versionFiles.get(v) || []), f]);
          }
          const duplicates = [...versionFiles.entries()].filter(([, group]) => group.length > 1);
          console.log('mode:', mode, '| files:', files.length, '| remote-applied:', remote.size, '| pending:', localOnly.length, '| duplicate versions:', duplicates.length);
          for (const [v, group] of duplicates) {
            console.error('::error::duplicate migration version ' + v + ' in repo (one version must name exactly one migration): ' + group.join(', '));
          }
          for (const v of remoteOnly) console.error('::error::remote-only migration (in DB, missing from repo): ' + v);
          if (mode === 'post') {
            for (const v of localOnly) console.error('::error::local-only migration (still not applied after db push): ' + v);
          }
          const drift = mode === 'post' ? (remoteOnly.length || localOnly.length) : remoteOnly.length;
          const failed = drift || duplicates.length;
          if (failed) {
            if (duplicates.length) {
              console.error('::error::resolve the duplicate version(s) above by renumbering one file to a version no migration uses — NOT by adding `db push` flags, which would hide which file is really live');
            }
            console.error('::error::migration drift detected — resolve with `supabase migration fetch` (adopt what is live) or a new migration file BEFORE deploying');
            process.exit(1);
          }
          if (mode === 'post') {
            console.log('Post-push OK — every repo migration is applied and nothing is live-only.');
          } else if (localOnly.length) {
            console.log('Pre-flight OK — ' + localOnly.length + ' migration(s) pending; db push will apply them.');
          } else {
            console.log('Pre-flight OK — repo and live DB already in sync.');
          }
          EOF

      - name: Migration drift check (repo vs live DB — fail-closed)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_URL: ${{ env.SUPABASE_DB_URL_RESOLVED }}
        run: node /tmp/driftcheck.mjs pre

      # Deliberately NOT `--include-all`. Measured 2026-10-15, run 38719764730:
      # the CLI exited 1 with "Found local migration files to be inserted before
      # the last migration on remote database. Rerun the command with
      # --include-all flag". The tempting read was "an out-of-order migration,
      # use the flag" -- but the real defect was that TWO repo files shared
      # version 20270119000000, and only the lexicographically-first of them
      # (20270119000000_harden_internship_auth_policy_and_monitor.sql) can match
      # the live row. The other one therefore sorted as an unapplied migration
      # forever, and pushing it tried to insert that version a second time
      # (duplicate key on schema_migrations). `--include-all` does not fix a
      # duplicate version: it forces the rogue file in anyway, so the deploy
      # would have applied an unverified file while the CI line that caught the
      # problem disappeared. Fixed at the source instead -- that file is now
      # 20270127000000_fix_admin_credentials_rls_and_realtime.sql, which sorts
      # after the newest applied version (20270119000027) and so applies with a
      # plain push. The drift check above additionally fails closed on any
      # duplicate version, so this class cannot come back silently.
      - name: Apply pending migrations (db push — no-op when in sync)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_URL: ${{ env.SUPABASE_DB_URL_RESOLVED }}
        run: |
          supabase db push --db-url "$SUPABASE_DB_URL"

      - name: Verify migrations applied (repo == live DB)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_URL: ${{ env.SUPABASE_DB_URL_RESOLVED }}
        run: node /tmp/driftcheck.mjs post

      - name: Deploy all edge functions from repo source
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -e
          failed=0
          for dir in supabase/functions/*/; do
            name=$(basename "$dir")
            if [ "$name" = "_shared" ]; then continue; fi
            echo "::group::deploy $name"
            if ! supabase functions deploy "$name" --project-ref "$SUPABASE_PROJECT_REF"; then
              echo "::error::functions deploy failed: $name"
              failed=1
            fi
            echo "::endgroup::"
          done
          exit $failed

      # Privilege-escalation + money-path pentest: throwaway accounts, real user
      # JWTs, every escape attempt over real HTTP (PostgREST + the withdrawal
      # edge function) — all must be refused, and the legitimate owner path at
      # each step must still work. Runs AFTER db push so it proves the deploy
      # landed the latest locks, and AFTER functions deploy so new RPC/guard
      # logic is live. Any landed escape exits 1.
      #
      # Needs SUPABASE_SERVICE_ROLE_KEY (admin user creation + full-cascade
      # teardown) and VITE_SUPABASE_ANON_KEY (user sign-in) — both are asserted
      # by the pre-flight guard step at the top of this job. SUPABASE_URL is
      # derived from the project ref — it must be the REST/edge endpoint, NOT the
      # Postgres pooler URL the migration steps use.
      - name: Privilege + money-path pentest (against deployed DB)
        env:
          SUPABASE_URL: https://${{ env.SUPABASE_PROJECT_REF }}.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          # Belt and braces: if a secret ever disappears between the pre-flight
          # guard and here, fail rather than quietly reporting an unverified
          # deploy. There is deliberately no skip path left in this step.
          if [ -z "$SUPABASE_SERVICE_ROLE_KEY" ] || [ -z "$VITE_SUPABASE_ANON_KEY" ]; then
            echo "::error::Pentest secrets vanished after the pre-flight guard — refusing to report a green deploy with an unrun security check."
            exit 1
          fi
          node scripts/e2e/pentest-privileges.mjs

      # Whole-surface audit, run after the curated pentest above.
      #
      # The pentest proves a chosen set of paths in depth; this proves the REST of
      # the surface in breadth — every private table read as an anonymous visitor,
      # every owner-scoped table read across two signed-in users, and every
      # anon-executable helper that takes a caller-supplied id called as anon with
      # a real victim id. It is what caught the payout-method leak and the
      # workspace RLS recursion, neither of which the curated list touched.
      #
      # It exits 1 on any finding and prints `vacuous` notes where a probe had no
      # data to hide, so an empty table is never counted as a pass.
      - name: Whole-surface audit (anon x cross-user x invariants)
        env:
          SUPABASE_URL: https://${{ env.SUPABASE_PROJECT_REF }}.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_SERVICE_ROLE_KEY" ] || [ -z "$VITE_SUPABASE_ANON_KEY" ]; then
            echo "::error::Audit secrets vanished after the pre-flight guard — refusing to report a green deploy with an unrun security check."
            exit 1
          fi
          node scripts/e2e/surface-audit.mjs
