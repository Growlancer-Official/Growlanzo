# Nginx configuration for Growlancer SPA
# This file can be used to serve the built application with proper SPA routing

server {
  listen 80;
  listen [::]:80;
  server_name _;

  # Gzip compression
  gzip on;
  gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/javascript application/json;
  gzip_vary on;
  gzip_min_length 1000;

  # Root directory for static files
  root /usr/share/nginx/html;
  index index.html;

  # Security headers
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-XSS-Protection "1; mode=block" always;
  add_header Referrer-Policy "no-referrer-when-downgrade" always;
  add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://growlancer.vercel.app https://checkout.razorpay.com https://checkout-static-next.razorpay.com https://cdn.razorpay.com https://*.paypal.com https://*.paypalobjects.com; style-src 'self' 'unsafe-inline' https://api.fontshare.com; img-src 'self' data: blob: https:; font-src 'self' data: https://api.fontshare.com https://cdn.fontshare.com; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://*.paypal.com https://api.razorpay.com https://api-dark.razorpay.com https://checkout.razorpay.com https://checkout-static-next.razorpay.com https://cdn.razorpay.com https://express.razorpay.com https://lumberjack.razorpay.com https://api.fontshare.com https://o4511722119495680.ingest.us.sentry.io; frame-src 'self' https://checkout.razorpay.com https://checkout-static-next.razorpay.com https://express.razorpay.com https://api.razorpay.com https://*.paypal.com; media-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self';" always;

  # Cache busting for static assets
  location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # SPA routing fallback
  # All requests not matching a physical file/directory are served index.html
  location / {
    try_files $uri $uri/ /index.html;

    # Don't cache index.html itself
    add_header Cache-Control "no-cache, no-store, must-revalidate";
  }

  # Health check endpoint (optional)
  location /_health {
    access_log off;
    return 200 "ok";
  }

  # Deny access to sensitive files
  location ~ /\. {
    deny all;
  }
}
